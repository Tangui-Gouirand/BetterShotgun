<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    /* Le popup ne sert plus qu'à démarrer l'interface dans un onglet où
       Chrome ne l'a pas injectée. Tout le reste se passe dans la page. */
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }

    body {
      width: 260px; padding: 14px;
      font: 400 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #1c1c1c; color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-size: 11px; font-weight: 700; letter-spacing: .8px;
      text-transform: uppercase; color: #ff765f;
    }

    p { margin-top: 8px; color: #a3a5a8; }

    button {
      width: 100%; height: 38px; margin-top: 12px;
      border: none; border-radius: 4px;
      background: #ff765f; color: #1c1c1c;
      font: 700 12px/1 inherit; letter-spacing: .7px; text-transform: uppercase;
      cursor: pointer;
    }
    button:hover { background: #ff8b77; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <h1>Shotgun</h1>
  <p id="msg">Vérification…</p>
  <script src="popup.js"></script>
</body>
</html>
