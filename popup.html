<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    /* ----------------------------------------------------------- tokens */
    :root {
      --bg: #ffffff;
      --surface: #f7f7f8;
      --surface-2: #f1f1f3;
      --fg: #18181b;
      --fg-soft: #52525b;
      --muted: #8b8b93;
      --border: #e6e6ea;
      --accent: #d1004b;
      --accent-fg: #ffffff;
      --accent-soft: #fff0f4;
      --warn-bg: #fff6e8;
      --warn-border: #f2ce97;
      --warn-fg: #7c4a06;
      --warn-dot: #e08a09;
      --ok-dot: #16a34a;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(16, 16, 20, .06), 0 4px 12px rgba(16, 16, 20, .05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151517;
        --surface: #1e1e21;
        --surface-2: #26262a;
        --fg: #f2f2f3;
        --fg-soft: #b9b9c0;
        --muted: #85858e;
        --border: #303036;
        --accent: #ff2d6f;
        --accent-fg: #1a0009;
        --accent-soft: #2a0f1a;
        --warn-bg: #2e2210;
        --warn-border: #5c421a;
        --warn-fg: #f0c078;
        --warn-dot: #d99a2b;
        --ok-dot: #34d399;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
      }
    }

    /* ------------------------------------------------------------- base */
    * { box-sizing: border-box; }

    body {
      width: 360px; margin: 0;
      font: 400 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .icon { width: 15px; height: 15px; flex: none; fill: none;
            stroke: currentColor; stroke-width: 1.9;
            stroke-linecap: round; stroke-linejoin: round; }

    /* ----------------------------------------------------------- header */
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand-tile {
      width: 30px; height: 30px; border-radius: 8px; flex: none;
      background: var(--accent); color: var(--accent-fg);
      display: grid; place-items: center;
    }
    .brand-tile .icon { width: 17px; height: 17px; stroke-width: 2.1; }

    .brand-name { font-size: 13px; font-weight: 650; letter-spacing: -.01em; }
    .brand-sub  { font-size: 11px; color: var(--muted); margin-top: 1px; }

    /* -------------------------------------------------------- contenu */
    main { padding: 14px 16px 16px; }

    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600; letter-spacing: .01em;
      padding: 3.5px 9px 3.5px 7px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--fg-soft); margin-bottom: 10px;
    }
    .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
    .pill.is-secret { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-fg); }
    .pill.is-secret .dot { background: var(--warn-dot); }
    .pill.is-public .dot { background: var(--ok-dot); }

    .title {
      font-size: 15px; font-weight: 650; line-height: 1.35;
      letter-spacing: -.015em; margin-bottom: 14px; word-break: break-word;
    }

    .field { margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }

    .label {
      font-size: 10px; font-weight: 600; letter-spacing: .07em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 3px;
    }
    .value { font-size: 13px; font-weight: 500; color: var(--fg); word-break: break-word; }

    /* coordonnées + copie */
    .coord {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 8px 7px 10px;
    }
    .coord code {
      flex: 1; font: 500 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--fg); letter-spacing: -.02em;
    }
    .copy {
      display: inline-flex; align-items: center; gap: 5px;
      font: 600 11px/1 inherit; font-family: inherit;
      color: var(--fg-soft); background: var(--bg);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 8px; cursor: pointer;
      transition: background .12s ease, color .12s ease, border-color .12s ease;
    }
    .copy:hover { background: var(--surface-2); color: var(--fg); }
    .copy.done { color: var(--ok-dot); border-color: var(--ok-dot); }
    .copy .icon { width: 13px; height: 13px; }

    /* boutons */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      width: 100%; padding: 9px 12px; margin-top: 4px;
      font: 600 12.5px/1 inherit; font-family: inherit;
      border-radius: 8px; text-decoration: none; cursor: pointer;
      transition: filter .12s ease, background .12s ease;
    }
    .btn-primary { background: var(--accent); color: var(--accent-fg); border: 1px solid transparent; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost { background: var(--bg); color: var(--fg); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--surface); }
    .btn .icon { width: 14px; height: 14px; }
    .btn-ghost .chan { color: var(--muted); font-weight: 500; }

    /* encarts */
    .callout {
      display: flex; gap: 9px; align-items: flex-start;
      border-radius: var(--radius); padding: 10px 11px;
      font-size: 12px; line-height: 1.45; margin-bottom: 14px;
    }
    .callout .icon { margin-top: 1px; }
    .callout-warn { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-fg); }
    .callout-info { background: var(--surface); border: 1px solid var(--border); color: var(--fg-soft); }

    /* section */
    .divider { height: 1px; background: var(--border); margin: 16px 0 13px; }
    .section-title {
      font-size: 12px; font-weight: 650; letter-spacing: -.005em;
      margin-bottom: 11px; display: flex; align-items: center; gap: 7px;
    }
    .section-title .icon { width: 14px; height: 14px; color: var(--accent); }

    .quotes { margin: 0; padding: 0; list-style: none; }
    .quotes li {
      position: relative; padding-left: 11px; margin-bottom: 7px;
      font-size: 12px; line-height: 1.45; color: var(--fg-soft);
    }
    .quotes li::before {
      content: ""; position: absolute; left: 0; top: 3px; bottom: 3px;
      width: 2px; border-radius: 2px; background: var(--accent); opacity: .5;
    }
    .quotes li:last-child { margin-bottom: 0; }

    /* état vide / message */
    .state { padding: 26px 16px 30px; text-align: center; color: var(--muted); }
    .state .icon { width: 22px; height: 22px; margin-bottom: 9px; color: var(--border); stroke-width: 1.6; }
    .state p { margin: 0; font-size: 12.5px; line-height: 1.5; }

    /* squelette de chargement */
    .skel { border-radius: 6px; background: var(--surface-2); animation: pulse 1.3s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
  </style>
</head>
<body>
  <!-- Icônes inline : la CSP des extensions interdit toute ressource externe. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-pin" viewBox="0 0 24 24">
      <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
    </symbol>
    <symbol id="i-ext" viewBox="0 0 24 24">
      <path d="M15 3h6v6"/><path d="M10 14 21 3"/>
      <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>
    </symbol>
    <symbol id="i-copy" viewBox="0 0 24 24">
      <rect x="9" y="9" width="12" height="12" rx="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24">
      <path d="M12 9v4"/><path d="M12 17h.01"/>
      <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>
    </symbol>
    <symbol id="i-info" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/>
    </symbol>
    <symbol id="i-megaphone" viewBox="0 0 24 24">
      <path d="m3 11 15-7v16L3 13Z"/><path d="M3 11v2a2 2 0 0 0 2 2h1"/><path d="M7 15v4a1 1 0 0 0 1 1h2"/>
    </symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 3 10l7 3 3 7 8-17Z"/><path d="m10 13 4-4"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>
    </symbol>
    <symbol id="i-compass" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/>
    </symbol>
  </svg>

  <header>
    <div class="brand-tile"><svg class="icon"><use href="#i-pin"/></svg></div>
    <div>
      <div class="brand-name">Révélateur de lieu</div>
      <div class="brand-sub">Shotgun</div>
    </div>
  </header>

  <main id="out">
    <div class="skel" style="width:34%;height:20px;border-radius:999px;margin-bottom:12px"></div>
    <div class="skel" style="width:82%;height:15px;margin-bottom:16px"></div>
    <div class="skel" style="width:45%;height:10px;margin-bottom:7px"></div>
    <div class="skel" style="width:66%;height:13px"></div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
